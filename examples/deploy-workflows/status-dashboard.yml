# .github/workflows/deploy.yml — generiert für: Status-Dashboard
# Kopiere diese Datei in: status-dashboard/.github/workflows/deploy.yml

name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    uses: mark-baumann/infrastruktur-deployment/.github/workflows/build-deploy.yml@master
    with:
        service_name: status-dashboard
        port: "8520"
        app_file: app/app.py
        healthcheck_type: http
    secrets: inherit
