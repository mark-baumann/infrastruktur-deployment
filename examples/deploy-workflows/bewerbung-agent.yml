# .github/workflows/deploy.yml — generiert für: Bewerbungsagent
# Kopiere diese Datei in: bewerbung-agent/.github/workflows/deploy.yml

name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    uses: mark-baumann/infrastruktur-deployment/.github/workflows/build-deploy.yml@master
    with:
        service_name: bewerbung-agent
        port: "8502"
        app_file: app.py
        healthcheck_type: http
    secrets: inherit
