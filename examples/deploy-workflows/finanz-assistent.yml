# .github/workflows/deploy.yml — generiert für: Finanz-Agenten
# Kopiere diese Datei in: finanz-assistent/.github/workflows/deploy.yml

name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    uses: mark-baumann/infrastruktur-deployment/.github/workflows/build-deploy.yml@master
    with:
        service_name: finanz-agenten
        port: "8502"
        app_file: app/app.py
        healthcheck_type: http
    secrets: inherit
