# ═══════════════════════════════════════════════════════════════
# Infrastruktur-Deployment — Deklarative Service-Definition
# ═══════════════════════════════════════════════════════════════
# Eine Quelle der Wahrheit für alle Dienste.
# Änderungen hier → scripts/render_configs.py generiert
# docker-compose.yml und cloudflared/config.yml automatisch.
#
# Felder:
#   type:        ui | headless | cron        (Default: ui)
#   expose:      true | false                (Default: true) → Cloudflare + Compose
#   healthcheck: http | heartbeat_file | ping_url  (Default: http)

services:
  - name: Vergleich-Agenten
    service_name: vergleich-agenten
    port: 8501
    repo: vergleichs-ki
    app_file: app/app.py
    domain: vergleichs-ki.markb.de
    type: ui
    expose: true
    healthcheck: http
    # Userspace-Deployment (kein Docker auf diesem Host): Ingress auf localhost
    ingress_host: localhost

  - name: Handels-Agenten
    port: 8503
    repo: handels-agenten
    app_file: app/streamlit_app.py
    domain: handels-agenten.markb.de
    type: ui
    expose: true
    healthcheck: http
    # Userspace-Deployment (kein Docker auf diesem Host): Ingress auf localhost
    ingress_host: localhost

  - name: Dokumenten-Agent
    port: 8512
    repo: rag-agent-langgraph
    app_file: app/app.py
    domain: dokumenten-agent.markb.de
    type: ui
    expose: true
    healthcheck: http
    # Userspace-Deployment (kein Docker auf diesem Host): Ingress auf localhost
    ingress_host: localhost
    # Persistente Vector-DB (ChromaDB) — Dokumente überleben Redeploys
    volumes:
      - /opt/data/dokumenten-agent/chroma:/app/data/chroma

  - name: Aktienanalyse
    port: 8513
    repo: taegliche-aktienanalyse
    app_file: app/app.py
    domain: aktienanalyse.markb.de
    type: ui
    expose: true
    healthcheck: http
    # Userspace-Deployment (kein Docker auf diesem Host): Ingress auf localhost
    ingress_host: localhost

  - name: eBay-Agent
    port: 8514
    repo: ebay-scraping-agent
    app_file: app/app.py
    domain: ebay-agent.markb.de
    type: ui
    expose: true
    healthcheck: http
    # Userspace-Deployment (kein Docker auf diesem Host): Ingress auf localhost
    ingress_host: localhost

  - name: Open-Manus
    port: 8516
    repo: open-manus
    app_file: app/app.py
    domain: open-manus.markb.de
    type: ui
    expose: true
    healthcheck: http
    # Userspace-Deployment (kein Docker auf diesem Host): Ingress auf localhost
    ingress_host: localhost

  - name: ART-Agent
    port: 8519
    repo: ART
    app_file: app/app.py
    domain: art-agent.markb.de
    type: ui
    expose: true
    healthcheck: http
    # Userspace-Deployment (kein Docker auf diesem Host): Ingress auf localhost
    ingress_host: localhost

  - name: Schach
    port: 8520
    repo: schach-reinforcement-lernen
    app_file: app.py
    domain: schach.markb.de
    type: ui
    expose: true
    healthcheck: http
    # Userspace-Deployment (kein Docker auf diesem Host): Ingress auf localhost
    ingress_host: localhost

  - name: Status-Dashboard
    service_name: status-dashboard
    port: 8521
    repo: status-dashboard
    app_file: app/app.py
    env_file: false
    domain: status.markb.de
    type: ui
    expose: true
    healthcheck: http
    # Userspace-Deployment (kein Docker auf diesem Host): Ingress auf localhost
    ingress_host: localhost
    volumes:
      - /opt/data/docker-status.json:/data/docker-status.json:ro

  - name: Bewerbungsagent
    service_name: bewerbung-agent
    port: 8502
    repo: bewerbung-agent
    app_file: app.py
    domain: bewerbung.markb.de
    type: ui
    expose: true
    healthcheck: http
    # Userspace-Deployment (kein Docker auf diesem Host): Ingress auf localhost
    ingress_host: localhost

  # ── Headless-Services (kein UI, kein Port, kein Cloudflare-Ingress) ──

  - name: Daten-Feed-Worker
    service_name: daten-feed-worker
    port: null
    repo: daten-feed-worker
    app_file: null
    domain: null
    type: headless
    expose: false
    healthcheck: heartbeat_file


  - name: OCR-Agent
    port: null
    repo: ocr_recognition_nn
    app_file: null
    domain: null
    type: headless
    expose: false  # vorerst ausgeschlossen — GPU-Workload, noch nicht deployed
    healthcheck: http

  - name: Spam-Klassifikation
    port: 8510
    repo: spam-klassifikation
    app_file: app/app.py
    domain: spam-klassifikation.markb.de
    type: ui
    expose: false  # kein Streamlit-UI vorhanden, vorerst deaktiviert
    healthcheck: http

  # ── WordPress ──

  - name: WordPress
    service_name: wordpress
    image: wordpress:latest  # offizielles Image, kein ghcr.io/mark-baumann
    port: 80
    domain: wordpress.markb.de
    type: ui
    expose: true
    healthcheck: http_ping  # einfacher HTTP-Ping statt Streamlit-Health
    env_file: true
    volumes:
      - /opt/data/wordpress/html:/var/www/html

  - name: WordPress-DB
    service_name: wordpress-db
    image: mariadb:11  # offizielles Image
    port: null
    domain: null
    type: headless
    expose: false
    healthcheck: none
    env_file: true
    network: edge  # muss auf edge-Netz sein damit WordPress sie erreicht
    volumes:
      - /opt/data/wordpress/db:/var/lib/mysql

  # ── Geplante Services (Repos noch nicht bereit) ──
  # - name: Verstaerkungslernen
  #   port: 8517
  #   repo: agenten-verstaerkungslernen   # Repo existiert noch nicht auf GitHub
  #   app_file: app/app.py
  #   domain: verstaerkungslernen.markb.de
  #   type: ui
  #   expose: false

# ── Cloudflare ──
cloudflare:
  zone_id: 582886dd1abc65507cea0db3c405446d
  account_id: 5af64f98bacf78ac2e177bbb31a34cd1
  tunnel_name: markb-tunnel-v4

# ── Pfade ──
paths:
  base: /opt/data
  venv: .venv
  log_dir: /tmp
  cloudflared_bin: /opt/data/bin/cloudflared
  token_file: /opt/data/.cloudflared/token.txt
