# ═══════════════════════════════════════════════════════════════
# Infrastruktur-Deployment — Deklarative Service-Definition
# ═══════════════════════════════════════════════════════════════
# Eine Quelle der Wahrheit für alle Dienste.
# Änderungen hier → scripts/render_configs.py generiert
# docker-compose.yml und cloudflared/config.yml automatisch.
#
# Felder:
#   type:        ui | headless | cron        (Default: ui)
#   expose:      true | false                (Default: true) → Cloudflare + Compose
#   healthcheck: http | heartbeat_file | ping_url  (Default: http)

services:
  - name: Vergleich-Agenten
    service_name: vergleich-agenten
    port: 8501
    repo: vergleichs-ki
    app_file: app/app.py
    domain: vergleichs-ki.markb.de
    type: ui
    expose: true
    healthcheck: http


  - name: Handels-Agenten
    port: 8503
    repo: handels-agenten
    app_file: app/streamlit_app.py
    domain: handels-agenten.markb.de
    type: ui
    expose: true
    healthcheck: http


  - name: Dokumenten-Agent
    port: 8512
    repo: rag-agent-langgraph
    app_file: app/app.py
    domain: dokumenten-agent.markb.de
    type: ui
    expose: true
    healthcheck: http

    # Persistente Vector-DB (ChromaDB) — Dokumente überleben Redeploys
    volumes:
      - /opt/data/dokumenten-agent/chroma:/app/data/chroma

  - name: Aktienanalyse
    port: 8513
    repo: taegliche-aktienanalyse
    app_file: app/app.py
    domain: aktienanalyse.markb.de
    type: ui
    expose: true
    healthcheck: http


  - name: eBay-Agent
    port: 8514
    repo: ebay-scraping-agent
    app_file: app/app.py
    domain: ebay-agent.markb.de
    type: ui
    expose: true
    healthcheck: http


  - name: Open-Manus
    port: 8516
    repo: open-manus
    app_file: app/app.py
    domain: open-manus.markb.de
    type: ui
    expose: true
    healthcheck: http


  - name: ART-Agent
    port: 8519
    repo: ART
    app_file: app/app.py
    domain: art-agent.markb.de
    type: ui
    expose: true
    healthcheck: http


  - name: Schach
    port: 8520
    repo: schach-reinforcement-lernen
    app_file: app.py
    domain: schach.markb.de
    type: ui
    expose: true
    healthcheck: http


  # ── Status-Dashboard (AUG-103: stillgelegt per Nutzer-Direktive) ──────────
  # Repo 'status-dashboard' existiert NICHT auf GitHub (404, verifiziert 31.08.2026).
