  - name: Bewerbungsagent
    service_name: bewerbung-agent
    port: 8502
    repo: bewerbung-agent
    app_file: app.py
    domain: bewerbung.markb.de
    type: ui
    expose: true
    healthcheck: http


  # ── Headless-Services (kein UI, kein Port, kein Cloudflare-Ingress) ──

  # ── Daten-Feed-Worker (AUG-113: kein Code, kein Repo) ───────────────────────
  # Repo 'daten-feed-worker' existiert NICHT auf GitHub (404, verifiziert 31.08.2026).
  # Kein Code lokal oder in Agent-Workspaces gefunden.
  # CoS-Entscheidung (Chief of Staff, 03.09.2026): Vorübergehend auskommentiert, um Pipeline-Fehler zu vermeiden.
  # - name: Daten-Feed-Worker
  #   service_name: daten-feed-worker
  #   port: null
  #   repo: daten-feed-worker
  #   app_file: null
  #   domain: null
  #   type: headless
  #   expose: false
  #   healthcheck: heartbeat_file


  # ── OCR-Agent (AUG-113: Repo-Mapping bereits korrekt) ───────────────────────
  # Repo 'ocr-erkennung' existiert auf GitHub (default-branch: claude/deepseek-ocr-streamlit-46tyl3).
  # services.yaml zeigt bereits auf 'ocr-erkennung' — kein PR erforderlich.
  # CoS-Entscheidung (Chief of Staff, 03.09.2026): Vorübergehend auskommentiert, da Image nicht auf GHCR vorhanden.
  # - name: OCR-Agent
  #   port: null
  #   repo: ocr-erkennung
  #   app_file: null
  #   domain: null
  #   type: headless
  #   expose: false  # vorerst ausgeschlossen — GPU-Workload, noch nicht deployed
  #   healthcheck: http

  - name: Spam-Klassifikation
    port: 8510
    repo: spam-klassifikation
    app_file: app/app.py
    domain: spam-klassifikation.markb.de
    type: ui
    expose: false  # kein Streamlit-UI vorhanden, vorerst deaktiviert
    healthcheck: http

  # ── WordPress ──

  - name: WordPress
    service_name: wordpress
    image: wordpress:latest  # offizielles Image, kein ghcr.io/mark-baumann
    port: 80
    domain: markb.de
    extra_domains: [www.markb.de]  # www leitet auch auf WordPress
    type: ui
    expose: true
    healthcheck: http_ping  # einfacher HTTP-Ping statt Streamlit-Health
    env_file: true
    volumes:
      - /opt/data/wordpress/html:/var/www/html

  - name: WordPress-DB
    service_name: wordpress-db
    image: mariadb:11  # offizielles Image
    port: null
    domain: null
    type: headless
    expose: false
    healthcheck: none
    env_file: true
    network: edge  # muss auf edge-Netz sein damit WordPress sie erreicht
    volumes:
      - /opt/data/wordpress/db:/var/lib/mysql

