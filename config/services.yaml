# ═══════════════════════════════════════════════════════════════
# Infrastruktur-Deployment — Deklarative Service-Definition
# ═══════════════════════════════════════════════════════════════
# Eine Quelle der Wahrheit für alle Dienste.
# Änderungen hier → scripts/render_configs.py generiert
# docker-compose.yml und cloudflared/config.yml automatisch.
#
# Felder:
#   type:        ui | headless | cron        (Default: ui)
#   expose:      true | false                (Default: true) → Cloudflare + Compose
#   healthcheck: http | heartbeat_file | ping_url  (Default: http)

services:
  - name: Vergleich-Agenten
    port: 8501
    repo: vergleichs-ki
    app_file: app/app.py
    domain: vergleich-agenten.markb.de
    type: ui
    expose: true
    healthcheck: http

  - name: Finanz-Agenten
    port: 8502
    repo: finanz-assistent
    app_file: app/app.py
    domain: finanz-agenten.markb.de
    type: ui
    expose: true
    healthcheck: http

  - name: Handels-Agenten
    port: 8503
    repo: handels-agenten
    app_file: app/streamlit_app.py
    domain: handels-agenten.markb.de
    type: ui
    expose: true
    healthcheck: http

  - name: KI-Lernplattform
    port: 8505
    repo: ki-lernplattform
    app_file: app/app.py
    domain: ki-lernplattform.markb.de
    type: ui
    expose: true
    healthcheck: http

  - name: Spam-Klassifikation
    port: 8510
    repo: spam-klassifikation
    app_file: app/app.py
    domain: spam-klassifikation.markb.de
    type: ui
    expose: true
    healthcheck: http

  - name: Anonymisierung
    service_name: anonymisierungs-pipeline
    port: 8511
    repo: anonymisierungs-pipeline
    app_file: app/app.py
    domain: anonymisierungs-pipeline.markb.de
    type: ui
    expose: true
    healthcheck: http

  - name: Dokumenten-Agent
    port: 8512
    repo: rag-agent-langgraph
    app_file: app/app.py
    domain: dokumenten-agent.markb.de
    type: ui
    expose: true
    healthcheck: http

  - name: Aktienanalyse
    port: 8513
    repo: taegliche-aktienanalyse
    app_file: app/app.py
    domain: aktienanalyse.markb.de
    type: ui
    expose: true
    healthcheck: http

  - name: eBay-Agent
    port: 8514
    repo: ebay-scraping-agent
    app_file: app/app.py
    domain: ebay-agent.markb.de
    type: ui
    expose: true
    healthcheck: http

  - name: Browser-Nutzung
    port: 8515
    repo: browser-nutzung
    app_file: app/app.py
    domain: browser-nutzung.markb.de
    type: ui
    expose: true
    healthcheck: http

  - name: Open-Manus
    port: 8516
    repo: open-manus
    app_file: app/app.py
    domain: open-manus.markb.de
    type: ui
    expose: true
    healthcheck: http

  - name: Verstärkungslernen
    port: 8517
    repo: agenten-verstaerkungslernen
    app_file: app/app.py
    domain: verstaerkungslernen.markb.de
    type: ui
    expose: true
    healthcheck: http

  - name: OCR-Agent
    port: 8518
    repo: ocr_recognition_nn
    app_file: app/app.py
    domain: ocr-agent.markb.de
    type: ui
    expose: false  # vorerst ausgeschlossen — GPU-Workload, noch nicht deployed
    healthcheck: http

  - name: ART-Agent
    port: 8519
    repo: ART
    app_file: app/app.py
    domain: art-agent.markb.de
    type: ui
    expose: true
    healthcheck: http

  - name: Status-Dashboard
    service_name: status-dashboard
    port: 8520
    repo: status-dashboard
    app_file: app/app.py
    env_file: false
    domain: status.markb.de
    type: ui
    expose: true
    healthcheck: http
    volumes:
      - /opt/data/docker-status.json:/data/docker-status.json:ro

  # ── Headless-Services (kein UI, kein Port, kein Cloudflare-Ingress) ──

  - name: Daten-Feed-Worker
    service_name: daten-feed-worker
    port: null
    repo: daten-feed-worker
    app_file: null
    domain: null
    type: headless
    expose: false
    healthcheck: heartbeat_file

# ── Cloudflare ──
cloudflare:
  zone_id: 582886dd1abc65507cea0db3c405446d
  account_id: 5af64f98bacf78ac2e177bbb31a34cd1
  tunnel_name: markb-tunnel-v3

# ── Pfade ──
paths:
  base: /opt/data
  venv: .venv
  log_dir: /tmp
  cloudflared_bin: /opt/data/bin/cloudflared
  token_file: /opt/data/.cloudflared/token.txt
