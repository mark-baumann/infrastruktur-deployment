# ── Cloudflare ──
cloudflare:
  zone_id: 582886dd1abc65507cea0db3c405446d
  account_id: 5af64f98bacf78ac2e177bbb31a34cd1
  tunnel_name: markb-tunnel-v4

# ── Pfade ──
paths:
  base: /opt/data
  venv: .venv
  log_dir: /tmp
  cloudflared_bin: /opt/data/bin/cloudflared
  token_file: /opt/data/.cloudflared/token.txt
