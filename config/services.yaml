# ═══════════════════════════════════════════════════════════════
# Infrastruktur-Deployment — Deklarative Service-Definition
# ═══════════════════════════════════════════════════════════════
# Eine Quelle der Wahrheit für alle Dienste.
# Änderungen hier → scripts/render_configs.py generiert
# docker-compose.yml und cloudflared/config.yml automatisch.
#
# Felder:
#   type:        ui | headless | cron        (Default: ui)
#   expose:      true | false                (Default: true) → Cloudflare + Compose
#   external:    true | false                (Default: false) → nur Cloudflare,
#                kein Compose-Service; Dienst läuft ausserhalb von Docker.
#                Zusammen mit 'ingress_host' verwenden.
#   ingress_host: Ziel-Host der Ingress-Regel (Default: Service-Key)
#   healthcheck: http | heartbeat_file | ping_url  (Default: http)
#   healthcheck_path: Pfad für http_ping (Default: /)
#   command:     Liste, überschreibt das Container-Kommando (optional)
#   environment: Map zusätzlicher Variablen; Werte dürfen ${VAR} aus der .env nutzen (optional)
#   volumes:     Host-Pfad:Ziel oder benanntes-volume:Ziel (wird automatisch deklariert)
#   build:       {context, args} — Image lokal auf dem Pi bauen; 'image' ist dann der lokale Tag (optional)
#   container_name / user: werden unverändert in den Compose-Service übernommen (optional)

services:
  - name: Handels-Agenten
    port: 8503
    repo: handels-agenten
    app_file: app/streamlit_app.py
    domain: handels-agenten.markb.de
    type: ui
    expose: true
    healthcheck: http
    # Bisher nur von Hand in der docker-compose.yml auf dem Pi ergänzt —
    # hier nachgezogen, damit der nächste Render-Lauf es nicht wieder entfernt.
    environment:
      TRADINGAGENTS_LLM_PROVIDER: ollama_cloud
    volumes:
      - handels_agenten_data:/home/appuser/.tradingagents



  - name: Dokumenten-Agent
    port: 8512
    repo: rag-agent-langgraph
    app_file: app/app.py
    domain: dokumenten-agent.markb.de
    type: ui
    expose: true
    healthcheck: http

    # Persistente Vector-DB (ChromaDB) — Dokumente überleben Redeploys
    volumes:
      - /opt/data/dokumenten-agent/chroma:/app/data/chroma


  - name: Spam-Klassifikation
    port: 8510
    repo: spam-klassifikation
    app_file: app/app.py
    domain: spam-klassifikation.markb.de
    type: ui
    expose: false  # kein Streamlit-UI vorhanden, vorerst deaktiviert
    healthcheck: http

  # ── Hermes Agent (Nous Research) — Dashboard + Gateway ──
  # Lief zuvor als von Hand ergänzter Compose-Service und wurde vom Render-Lauf
  # (--remove-orphans) entfernt. Dashboard-Login: Basic-Auth aus
  # /home/mark/.hermes/config.yaml (dashboard.basic_auth).
  # env_file: false — der Agent führt Shell-Befehle aus und bekommt deshalb nur
  # die unten genannten Variablen, nicht die komplette Stack-.env.
  - name: Hermes-Agent
    service_name: hermes-agent
    image: nousresearch/hermes-agent:latest  # offizielles Image
    port: 9119
    domain: hermes-agent.markb.de
    type: ui
    expose: true
    healthcheck: http_ping
    healthcheck_path: /api/health  # "/" leitet auf /login um
    env_file: false
    command: ["gateway", "run"]
    environment:
      OPENAI_API_KEY: ${OLLAMA_API_KEY}
      OPENAI_BASE_URL: ${OLLAMA_BASE_URL}
      OPENAI_MODEL: ${OLLAMA_MODEL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      LLM_MODEL: ${OLLAMA_MODEL}
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: 8642
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY}
      HERMES_DASHBOARD: 1
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: 9119
      HERMES_UID: 1000
      HERMES_GID: 1000
    volumes:
      - /home/mark/.hermes:/opt/data

  # ── Paperclip (paperclipai) — Agenten-Board ──
  # Lief zuvor als von Hand ergänzter Compose-Service und wurde vom Render-Lauf
  # (--remove-orphans) entfernt. Daten/DB liegen in /opt/data/paperclip.
  # Lokaler Patch auf dem Upstream-Image (paperclip-patch/): eine Queued-Run, die
  # sich nicht claimen lässt, crasht den Serverstart nicht mehr. Nach einem
  # Upstream-Update neu bauen:  docker compose build --pull paperclip
  # Secrets (BETTER_AUTH_SECRET, PAPERCLIP_TOOL_ACTION_SIGNING_SECRET,
  # PAPERCLIP_PUBLIC_URL) stehen in der Stack-.env auf dem Pi.
  - name: Paperclip
    service_name: paperclip
    image: paperclip-patched:local
    build:
      context: ./paperclip-patch
      args:
        PAPERCLIP_IMAGE_TAG: ${PAPERCLIP_IMAGE_TAG:-latest}
    container_name: paperclip
    user: "1000:1000"
    port: 3100
    domain: paperclip.markb.de
    type: ui
    expose: true
    healthcheck: http_ping
    healthcheck_path: /api/health
    env_file: true
    environment:
      HOST: 0.0.0.0
      SERVE_UI: "true"
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET}
      OPENAI_API_KEY: ${OLLAMA_API_KEY}
      OPENAI_BASE_URL: ${OLLAMA_BASE_URL}
      OPENAI_MODEL: ${OLLAMA_MODEL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
    volumes:
      - /opt/data/paperclip:/paperclip

  # ── WordPress ──

  - name: WordPress
    service_name: wordpress
    image: wordpress:latest  # offizielles Image, kein ghcr.io/mark-baumann
    port: 80
    domain: markb.de
    extra_domains: [www.markb.de]  # www leitet auch auf WordPress
    type: ui
    expose: true
    healthcheck: http_ping  # einfacher HTTP-Ping statt Streamlit-Health
    env_file: true
    volumes:
      - /opt/data/wordpress/html:/var/www/html

  - name: WordPress-DB
    service_name: wordpress-db
    image: mariadb:11  # offizielles Image
    port: null
    domain: null
    type: headless
    expose: false
    healthcheck: none
    env_file: true
    network: edge  # muss auf edge-Netz sein damit WordPress sie erreicht
    volumes:
      - /opt/data/wordpress/db:/var/lib/mysql

  # ── Geplante Services (Repos noch nicht bereit) ──
  # - name: Verstaerkungslernen
  #   port: 8517
  #   repo: agenten-verstaerkungslernen   # Repo existiert noch nicht auf GitHub
  #   app_file: app/app.py
  #   domain: verstaerkungslernen.markb.de
  #   type: ui
  #   expose: false

# ── Cloudflare ──
  # ── E-Mail-Agent (IMAP-Assistent) ──
  # Läuft nicht in Docker, sondern als systemd-Benutzerdienst auf dem Pi
  # (email-inbox.service, Port 8081; 8080 belegt Traefik). Deshalb
  # external: true — nur Ingress-Regel, kein Compose-Service.
  # Ziel ist das Gateway des edge-Netzes, über das cloudflared den Host erreicht.
  - name: E-Mail-Agent
    port: 8081
    domain: email-agent.markb.de
    type: ui
    expose: true
    external: true
    ingress_host: 172.19.0.1
    healthcheck: http


cloudflare:
  zone_id: 582886dd1abc65507cea0db3c405446d
  account_id: 5af64f98bacf78ac2e177bbb31a34cd1
  tunnel_name: markb-tunnel-v4

# ── Pfade ──
paths:
  base: /opt/data
  venv: .venv
  log_dir: /tmp
  cloudflared_bin: /opt/data/bin/cloudflared
  token_file: /opt/data/.cloudflared/token.txt
