name: Mint Tunnel Run Token

# Holt das Cloudflare Tunnel-Run-Token (markb-tunnel-v4) über den
# CF_API_TOKEN (GitHub-Secret) und lädt es als kurzlebiges Artifact hoch.
# Der Token-Wert wird NIE ins Job-Log geschrieben (Masking, public-Repo).
on:
  workflow_dispatch:

jobs:
  mint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tunnel-Run-Token abholen
        id: mint
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          ACCOUNT_ID="5af64f98bacf78ac2e177bbb31a34cd1"
          TUNNEL_ID="190681a1-5715-43ed-885c-6fcfb2eecb22"
          API="https://api.cloudflare.com/client/v4"
          curl -s -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "$API/accounts/$ACCOUNT_ID/cfd_tunnel/$TUNNEL_ID/token" \
            -o /tmp/cf-resp.json -w "HTTP %{http_code}\n"
          python3 - <<'PY'
          import json, re
          raw = open('/tmp/cf-resp.json').read()
          redacted = re.sub(r'[A-Za-z0-9_-]{40,}', '***REDACTED***', raw)
          print("Antwort (redigiert):", redacted[:2000])
          try:
              data = json.loads(raw)
          except Exception as e:
              print("Kein JSON:", e)
              raise SystemExit(1)
          if isinstance(data, dict) and data.get('success'):
              token = data['result']
              if not isinstance(token, str) or len(token) < 20:
                  print("❌ Unerwartetes result-Format:", type(token))
                  raise SystemExit(1)
              with open('tunnel-token.txt', 'w') as f:
                  f.write(token)
              print("✅ Token erfolgreich abgeholt (Länge: %d)" % len(token))
              print("token_ok=true")
          else:
              errs = data.get('errors', data) if isinstance(data, dict) else data
              print("❌ Cloudflare-Fehler:", json.dumps(errs, indent=2, ensure_ascii=False))
              print("token_ok=false")
              raise SystemExit(1)
          PY

      - name: Token als Artifact hochladen
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-token
          path: tunnel-token.txt
          retention-days: 1
