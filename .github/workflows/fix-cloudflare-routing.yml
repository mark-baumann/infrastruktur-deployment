name: Fix Cloudflare Tunnel Routing

on:
  workflow_dispatch:
    inputs:
      cf_api_token:
        required: true
        type: string
        description: "Cloudflare API Token (Zone:DNS:Edit + Account:Cloudflare Tunnel:Edit)"
      cf_account_id:
        required: true
        type: string
        description: "Cloudflare Account ID (aus dash.cloudflare.com rechts unten)"

jobs:
  update-routing:
    runs-on: ubuntu-latest
    steps:
      - name: Update Cloudflare Tunnel Ingress Rules
        env:
          CF_API_TOKEN: ${{ inputs.cf_api_token }}
          CF_ACCOUNT_ID: ${{ inputs.cf_account_id }}
          TUNNEL_ID: "190681a1-5715-43ed-885c-6fcfb2eecb22"
        run: |
          # Korrekte Ingress-Regeln mit Docker-Service-Namen statt localhost
          INGRESS_JSON='{
            "config": {
              "ingress": [
                {"hostname": "vergleich-agenten.markb.de",     "service": "http://vergleich-agenten:8501"},
                {"hostname": "finanz-agenten.markb.de",        "service": "http://finanz-agenten:8502"},
                {"hostname": "handels-agenten.markb.de",       "service": "http://handels-agenten:8503"},
                {"hostname": "ki-lernplattform.markb.de",      "service": "http://ki-lernplattform:8505"},
                {"hostname": "spam-klassifikation.markb.de",   "service": "http://spam-klassifikation:8510"},
                {"hostname": "anonymisierungs-pipeline.markb.de", "service": "http://anonymisierungs-pipeline:8511"},
                {"hostname": "dokumenten-agent.markb.de",      "service": "http://dokumenten-agent:8512"},
                {"hostname": "aktienanalyse.markb.de",         "service": "http://aktienanalyse:8513"},
                {"hostname": "ebay-agent.markb.de",            "service": "http://ebay-agent:8514"},
                {"hostname": "browser-nutzung.markb.de",       "service": "http://browser-nutzung:8515"},
                {"hostname": "open-manus.markb.de",            "service": "http://open-manus:8516"},
                {"hostname": "verstaerkungslernen.markb.de",   "service": "http://verstaerkungslernen:8517"},
                {"hostname": "art-agent.markb.de",             "service": "http://art-agent:8519"},
                {"hostname": "status.markb.de",                "service": "http://status-dashboard:8520"},
                {"service": "http_status:404"}
              ]
            }
          }'

          echo "Aktualisiere Cloudflare Tunnel Ingress-Regeln..."
          RESPONSE=$(curl -s -X PUT \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/cfd_tunnel/${TUNNEL_ID}/configurations" \
            -d "$INGRESS_JSON")

          SUCCESS=$(echo "$RESPONSE" | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')); console.log(d.success);")

          if [ "$SUCCESS" = "true" ]; then
            echo "✅ Cloudflare Ingress-Regeln erfolgreich aktualisiert!"
            echo "Alle Services nutzen jetzt Docker-Service-Namen."
            echo "cloudflared übernimmt die Änderung sofort (kein Neustart nötig)."
          else
            echo "❌ Fehler beim Aktualisieren:"
            echo "$RESPONSE" | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')); console.log(JSON.stringify(d.errors||d, null, 2));"
            exit 1
          fi

      - name: Verify Services Reachable
        run: |
          echo "Warte 5 Sekunden auf cloudflared Hot-Reload..."
          sleep 5
          echo "=== HTTP-Status nach Update ==="
          SERVICES=(
            "vergleich-agenten.markb.de"
            "spam-klassifikation.markb.de"
            "ebay-agent.markb.de"
            "dokumenten-agent.markb.de"
            "browser-nutzung.markb.de"
            "open-manus.markb.de"
            "art-agent.markb.de"
            "status.markb.de"
          )
          for svc in "${SERVICES[@]}"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://$svc" 2>/dev/null)
            if [ "$CODE" = "200" ]; then
              echo "✅ $CODE https://$svc"
            else
              echo "⚠️  $CODE https://$svc"
            fi
          done
