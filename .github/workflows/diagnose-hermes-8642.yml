name: Diagnose Hermes 8642 (AUG-671)

# Temporäres Diagnose-Workflow für AUG-671: findet den/die Prozess(e), die die
# "Hermes API-Server" / Port-8642-Ticket-Wellen (AUG-573ff) erzeugen, und wie
# sie an CTOs Paperclip-Credentials kommen. Läuft auf dem Pi-Runner (kein
# direkter SSH-Zugriff verfügbar/erlaubt). Ergänzt diagnose-cron.yml (AUG-620),
# das keinen Port-Scan und keine .hermes-Verzeichnis-Inspektion enthielt.
#
# Gibt niemals volle Secret-Werte aus — nur Fundstellen (Dateipfade,
# Variablennamen), damit das Log selbst (auf dem Pi-Runner sichtbar) kein
# weiteres Leck erzeugt.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: [self-hosted, pi]
    steps:
      - name: Port 8642 Listener
        run: |
          set +e
          echo "=== ss -tlnp | grep 8642 ==="
          sudo ss -tlnp | grep 8642
          echo "=== ss -tlnp (alles 85xx/86xx zum Vergleich) ==="
          sudo ss -tlnp | grep -E ':85[0-9]{2}|:86[0-9]{2}'
          echo "=== fuser 8642/tcp ==="
          sudo fuser 8642/tcp 2>&1
          exit 0

      - name: systemd Units mit 'hermes'
        run: |
          set +e
          echo "=== systemctl list-units --all | grep -i hermes ==="
          systemctl list-units --all --no-pager | grep -i hermes
          echo "=== systemctl list-unit-files | grep -i hermes ==="
          systemctl list-unit-files --no-pager | grep -i hermes
          exit 0

      - name: /opt/data/.hermes* Inspektion
        run: |
          set +e
          echo "=== ls -la /opt/data/.hermes* ==="
          sudo ls -la /opt/data/.hermes 2>&1
          sudo ls -la /opt/data/.hermes_history 2>&1
          echo "=== Dateitypen unter /opt/data/.hermes ==="
          sudo find /opt/data/.hermes -maxdepth 3 -type f 2>/dev/null
          echo "=== letzte 40 Zeilen .hermes_history (falls Textdatei) ==="
          sudo tail -n 40 /opt/data/.hermes_history 2>&1
          exit 0

      - name: Cron-/Prozess-Trigger fuer Gemini-CLI-Sessions
        run: |
          set +e
          echo "=== crontab -l (mark) ==="
          crontab -l -u mark 2>&1
          echo "=== crontab -l (root) ==="
          sudo crontab -l -u root 2>&1
          echo "=== laufende gemini/node/python Prozesse mit Working-Dir /opt/data ==="
          ps auxww | grep -iE 'gemini|hermes' | grep -v grep
          echo "=== .gemini Session-Dateien der letzten 48h, die 'ALERT' oder 'Service DOWN' enthalten (nur Dateinamen+Zeitstempel) ==="
          sudo find /home/mark/.gemini -name '*.jsonl' -mtime -2 -exec grep -l 'Service DOWN\|ALERT\]' {} \;
          exit 0

      - name: Credential-Quelle eingrenzen (nur Fundstellen, keine Werte)
        run: |
          set +e
          echo "=== Dateien mit PAPERCLIP_API_KEY als Variablenname unter /opt/data und /home/mark (keine Werte ausgeben) ==="
          sudo grep -rlI "PAPERCLIP_API_KEY" /opt/data /home/mark/.gemini /home/mark/.claude /home/mark/.config 2>/dev/null | grep -v -E '\.git/'
          echo "=== Dateien mit 'pcp_' Praefix (Paperclip Board-API-Key-Format), nur Fundstellen ==="
          sudo grep -rlI "pcp_[a-f0-9]\{20,\}" /opt/data /home/mark 2>/dev/null | grep -v -E '\.git/|/infrastruktur-deployment/'
          exit 0
