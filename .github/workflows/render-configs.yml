# ═══════════════════════════════════════════════════════════════
# render-configs.yml — Auto-Generierung bei services.yaml Änderung
# ═══════════════════════════════════════════════════════════════
# Triggered wenn config/services.yaml geändert wird.
# Generiert docker-compose.yml, cloudflared/config.yml
# und Beispiel-Deploy-Workflows, dann committet zurück.

name: Render Configs

on:
  push:
    branches: [master]
    paths:
      - config/services.yaml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-and-deploy:
    runs-on: [self-hosted, markb]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pyyaml
        run: pip install pyyaml --quiet --break-system-packages

      - name: Render configs + example workflows
        run: python scripts/render_configs.py --generate-workflows

      - name: Commit + Push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml cloudflared/config.yml examples/deploy-workflows/
          git diff --staged --quiet || git commit -m "chore: auto-generate configs from services.yaml [skip ci]"
          git push

      - name: Deploy updated stack
        run: |
          STACK_DIR=""
          for DIR in /opt/data/stack /opt/stack /home/mark/stack /home/mark/infrastruktur-deployment /home/mark/projects/infrastruktur-deployment; do
            if [ -d "$DIR" ]; then
              STACK_DIR="$DIR"
              break
            fi
          done

          if [ -z "$STACK_DIR" ]; then
            STACK_DIR="/home/mark/infrastruktur-deployment"
            mkdir -p "$STACK_DIR/cloudflared"
          fi

          cp docker-compose.yml "$STACK_DIR/"
          cp cloudflared/config.yml "$STACK_DIR/cloudflared/"

          if [ ! -f "$STACK_DIR/.env" ] && [ -f .env.template ]; then
            cp .env.template "$STACK_DIR/.env"
          fi

          cd "$STACK_DIR"
          docker compose up -d
