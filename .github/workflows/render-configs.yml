# ═══════════════════════════════════════════════════════════════
# render-configs.yml — Auto-Generierung bei services.yaml Änderung
# ═══════════════════════════════════════════════════════════════
# Triggered wenn config/services.yaml geändert wird.
# Generiert docker-compose.yml, cloudflared/config.yml
# und Beispiel-Deploy-Workflows, dann committet zurück.

name: Render Configs

on:
  push:
    branches: [master]
    paths:
      - config/services.yaml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-and-deploy:
    runs-on: [self-hosted, markb]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pyyaml
        run: pip install pyyaml --quiet

      - name: Render configs + example workflows
        run: python scripts/render_configs.py --generate-workflows

      - name: Commit + Push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml cloudflared/config.yml examples/deploy-workflows/
          git diff --staged --quiet || git commit -m "chore: auto-generate configs from services.yaml [skip ci]"
          git push

      - name: Deploy updated stack
        run: |
          for STACK_DIR in /opt/data/stack /opt/stack /home/mark/stack /home/mark/infrastruktur-deployment /home/mark/projects/infrastruktur-deployment; do
            [ -f "$STACK_DIR/docker-compose.yml" ] && break
          done
          [ -f "$STACK_DIR/docker-compose.yml" ] || { echo "Stack-Verzeichnis nicht gefunden"; exit 1; }
          cd "$STACK_DIR"
          docker compose up -d
