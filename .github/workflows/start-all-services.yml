name: Start All Services

on:
  workflow_dispatch:

jobs:
  start-all:
    runs-on: [self-hosted, pi]
    steps:
      - name: 🔐 Configure .env (Secrets → Pi)
        env:
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_BASE_URL: https://ollama.com/v1
          OLLAMA_MODEL: glm-5.3-flash
          LLM_MODEL: glm-5.3-flash
        run: |
          for STACK_DIR in /opt/data/stack /opt/stack /home/mark/stack /home/mark/infrastruktur-deployment /home/mark/projects/infrastruktur-deployment; do
            [ -f "$STACK_DIR/docker-compose.yml" ] && break
          done
          cd "$STACK_DIR"
          touch .env
          if [ -n "$TUNNEL_TOKEN" ]; then
            if grep -q "^TUNNEL_TOKEN=" .env 2>/dev/null; then
              sed -i "s|^TUNNEL_TOKEN=.*|TUNNEL_TOKEN=${TUNNEL_TOKEN}|" .env
            else
              echo "TUNNEL_TOKEN=${TUNNEL_TOKEN}" >> .env
            fi
            echo "✅ TUNNEL_TOKEN in .env gesetzt"
          else
            echo "⚠️ TUNNEL_TOKEN nicht verfügbar (Secret fehlt?)"
          fi
          if [ -n "$OLLAMA_API_KEY" ]; then
            if grep -q "^OLLAMA_API_KEY=" .env 2>/dev/null; then
              sed -i "s|^OLLAMA_API_KEY=.*|OLLAMA_API_KEY=${OLLAMA_API_KEY}|" .env
            else
              echo "OLLAMA_API_KEY=${OLLAMA_API_KEY}" >> .env
            fi
            if grep -q "^OLLAMA_BASE_URL=" .env 2>/dev/null; then
              sed -i "s|^OLLAMA_BASE_URL=.*|OLLAMA_BASE_URL=${OLLAMA_BASE_URL}|" .env
            else
              echo "OLLAMA_BASE_URL=${OLLAMA_BASE_URL}" >> .env
            fi
            if grep -q "^OLLAMA_MODEL=" .env 2>/dev/null; then
              sed -i "s|^OLLAMA_MODEL=.*|OLLAMA_MODEL=${OLLAMA_MODEL}|" .env
            else
              echo "OLLAMA_MODEL=${OLLAMA_MODEL}" >> .env
            fi
            if grep -q "^LLM_MODEL=" .env 2>/dev/null; then
              sed -i "s|^LLM_MODEL=.*|LLM_MODEL=${LLM_MODEL}|" .env
            else
              echo "LLM_MODEL=${LLM_MODEL}" >> .env
            fi
            echo "✅ OLLAMA in .env gesetzt"
          else
            echo "⚠️ OLLAMA_API_KEY Secret fehlt"
          fi

      - name: 🚀 Start Available Services
        run: |
          for STACK_DIR in /opt/data/stack /opt/stack /home/mark/stack /home/mark/infrastruktur-deployment /home/mark/projects/infrastruktur-deployment; do
            [ -f "$STACK_DIR/docker-compose.yml" ] && break
          done
          [ -f "$STACK_DIR/docker-compose.yml" ] || { echo "❌ Stack-Dir nicht gefunden"; exit 1; }
          cd "$STACK_DIR"
          [ -d .git ] && git pull --ff-only origin master || echo "⚠️ Not a git repository, skipping git pull"

          echo "=== Starte Cloudflare-Tunnel ==="
          docker compose up -d --no-deps cloudflared && echo "✅ cloudflared" || echo "❌ cloudflared"

          echo "=== Starte Services (per-service, Image muss lokal vorhanden sein) ==="
          OK=0
          FAIL=0
          NO_IMG=0

          start_service() {
            local SVC=$1
            if docker compose pull "$SVC" 2>&1 | grep -q "denied\|not found\|No such image\|manifest unknown"; then
              echo "⚠️  $SVC — kein Image auf GHCR, skip"
              NO_IMG=$((NO_IMG+1))
              return
            fi
            if docker compose up -d --no-deps "$SVC" 2>&1; then
              echo "✅ $SVC gestartet"
              OK=$((OK+1))
            else
              echo "❌ $SVC Start fehlgeschlagen"
              FAIL=$((FAIL+1))
            fi
          }

          for SVC in $(docker compose config --services | grep -v '^cloudflared$'); do
            start_service "$SVC"
          done

          echo ""
          echo "=== Container Status ==="
          docker compose ps
          echo ""
          echo "=== Ergebnis: $OK gestartet, $FAIL Fehler, $NO_IMG kein Image ==="
          [ "$FAIL" -eq 0 ] || exit 1
