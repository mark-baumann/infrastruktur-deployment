name: Start All Services

on:
  workflow_dispatch:

jobs:
  start-all:
    runs-on: [self-hosted, pi]
    steps:
      - name: 🔐 Configure .env (Secrets → Pi)
        env:
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
        run: |
          for STACK_DIR in /opt/data/stack /opt/stack /home/mark/stack /home/mark/infrastruktur-deployment /home/mark/projects/infrastruktur-deployment; do
            [ -f "$STACK_DIR/docker-compose.yml" ] && break
          done
          cd "$STACK_DIR"
          touch .env
          if [ -n "$TUNNEL_TOKEN" ]; then
            if grep -q "^TUNNEL_TOKEN=" .env 2>/dev/null; then
              sed -i "s|^TUNNEL_TOKEN=.*|TUNNEL_TOKEN=${TUNNEL_TOKEN}|" .env
            else
              echo "TUNNEL_TOKEN=${TUNNEL_TOKEN}" >> .env
            fi
            echo "✅ TUNNEL_TOKEN in .env gesetzt"
          else
            echo "⚠️ TUNNEL_TOKEN Secret fehlt"
          fi

      - name: 🚀 Start All Services
        run: |
          for STACK_DIR in /opt/data/stack /opt/stack /home/mark/stack /home/mark/infrastruktur-deployment /home/mark/projects/infrastruktur-deployment; do
            [ -f "$STACK_DIR/docker-compose.yml" ] && break
          done
          [ -f "$STACK_DIR/docker-compose.yml" ] || { echo "❌ Stack-Dir nicht gefunden"; exit 1; }
          cd "$STACK_DIR"
          git pull --ff-only origin master
          echo "=== Starte alle Services (ohne neu-Pull) ==="
          docker compose up -d --no-deps \
            vergleich-agenten \
            finanz-agenten \
            handels-agenten \
            ki-lernplattform \
            spam-klassifikation \
            anonymisierungs-pipeline \
            dokumenten-agent \
            aktienanalyse \
            ebay-agent \
            browser-nutzung \
            open-manus \
            verstaerkungslernen \
            art-agent \
            status-dashboard \
            cloudflared
          echo "=== Container Status ==="
          docker compose ps

      - name: 🩺 Health Checks
        run: |
          for STACK_DIR in /opt/data/stack /opt/stack /home/mark/stack /home/mark/infrastruktur-deployment /home/mark/projects/infrastruktur-deployment; do
            [ -f "$STACK_DIR/docker-compose.yml" ] && break
          done
          cd "$STACK_DIR"
          sleep 15
          declare -A PORTS=(
            [vergleich-agenten]=8501
            [finanz-agenten]=8502
            [handels-agenten]=8503
            [ki-lernplattform]=8505
            [spam-klassifikation]=8510
            [anonymisierungs-pipeline]=8511
            [dokumenten-agent]=8512
            [aktienanalyse]=8513
            [ebay-agent]=8514
            [browser-nutzung]=8515
            [open-manus]=8516
            [verstaerkungslernen]=8517
            [art-agent]=8519
            [status-dashboard]=8520
          )
          OK=0
          FAIL=0
          for SVC in "${!PORTS[@]}"; do
            PORT="${PORTS[$SVC]}"
            STATUS=$(docker compose exec -T "$SVC" \
              python -c "import urllib.request; urllib.request.urlopen('http://localhost:${PORT}/_stcore/health')" \
              2>/dev/null && echo "✅" || echo "❌")
            echo "$STATUS $SVC (Port $PORT)"
            [ "$STATUS" = "✅" ] && OK=$((OK+1)) || FAIL=$((FAIL+1))
          done
          echo "=== Ergebnis: $OK OK, $FAIL fehlgeschlagen ==="
          [ "$FAIL" -le 2 ] && exit 0 || exit 1
