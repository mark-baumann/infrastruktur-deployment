name: Diag Runner Dir (temp, AUG-422)

on:
  workflow_dispatch:
    inputs:
      target_repo:
        required: true
        type: string

jobs:
  diag:
    runs-on: [self-hosted, pi]
    steps:
      - name: Inspect runner directory (read-only)
        run: |
          DIR="/home/mark/runners/${{ inputs.target_repo }}"
          echo "=== ls -la $DIR ==="
          ls -la "$DIR" 2>&1 || true
          echo "=== .runner ==="
          cat "$DIR/.runner" 2>&1 || echo "(missing)"
          echo "=== .runner_migrated ==="
          cat "$DIR/.runner_migrated" 2>&1 || echo "(missing)"
          echo "=== .credentials ==="
          cat "$DIR/.credentials" 2>&1 || echo "(missing)"
          echo "=== .service ==="
          cat "$DIR/.service" 2>&1 || echo "(missing)"
          echo "=== stat .runner (owner) ==="
          stat "$DIR/.runner" 2>&1 || echo "(missing)"
