name: Diag Runner Dir (temp, AUG-422)

on:
  workflow_dispatch:
    inputs:
      target_repo:
        required: true
        type: string
      fix_symlinks:
        required: false
        type: boolean
        default: false

jobs:
  diag:
    runs-on: [self-hosted, pi]
    steps:
      - name: Inspect / repair runner directory symlinks
        run: |
          DIR="/home/mark/runners/${{ inputs.target_repo }}"
          echo "=== before: ls -la $DIR ==="
          ls -la "$DIR" 2>&1 || true

          if [ "${{ inputs.fix_symlinks }}" = "true" ]; then
            echo "=== repairing bin/externals symlinks to point locally ==="
            for LNK in bin externals; do
              if [ -L "$DIR/$LNK" ]; then
                TARGET_BASENAME=$(basename "$(readlink "$DIR/$LNK")")
                echo "relinking $LNK -> $DIR/$TARGET_BASENAME"
                ln -sfn "$DIR/$TARGET_BASENAME" "$DIR/$LNK"
              fi
            done
          fi

          echo "=== after: ls -la $DIR ==="
          ls -la "$DIR" 2>&1 || true
