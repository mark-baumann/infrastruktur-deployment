name: Diag Runner Dir (temp, AUG-422)

on:
  workflow_dispatch:
    inputs:
      target_repo:
        required: true
        type: string

jobs:
  diag:
    runs-on: [self-hosted, pi]
    steps:
      - name: Inspect runner directory (read-only)
        run: |
          DIR="/home/mark/runners/${{ inputs.target_repo }}"
          echo "=== ls -la $DIR ==="
          ls -la "$DIR" 2>&1 || true
          echo "=== .service ==="
          cat "$DIR/.service" 2>&1 || echo "(missing)"
          echo "=== .runner ==="
          cat "$DIR/.runner" 2>&1 || echo "(missing)"
          echo "=== systemctl list-units matching actions.runner ==="
          systemctl list-units --all 'actions.runner*' --no-pager 2>&1 || true
          echo "=== grep SVC_NAME in local svc.sh ==="
          grep -n "SVC_NAME\|\.service" "$DIR/svc.sh" 2>&1 | head -30 || true
