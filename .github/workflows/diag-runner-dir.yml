name: Diag Runner Dir (temp, AUG-422)

on:
  workflow_dispatch:
    inputs:
      target_repo:
        required: true
        type: string

jobs:
  diag:
    runs-on: [self-hosted, pi]
    steps:
      - name: Inspect runner directory (read-only)
        run: |
          DIR="/home/mark/runners/${{ inputs.target_repo }}"
          echo "=== ls -la $DIR ==="
          ls -la "$DIR" 2>&1 || true
          echo "=== .runner_migrated ==="
          cat "$DIR/.runner_migrated" 2>&1 || echo "(missing)"
          echo "=== config.sh remove --help-ish (run with bogus token to see message) ==="
          cd "$DIR" && ./config.sh remove --token BOGUS 2>&1 || true
          echo "=== after bogus remove: ls -la ==="
          ls -la "$DIR" 2>&1 || true
          echo "=== grep 'already configured' / 'isConfigured' style strings in config.sh ==="
          grep -n "configured\|RUNNER_ALLOW\|configuredFile\|\.runner\b" "$DIR/config.sh" 2>&1 | head -40 || true
