# ═══════════════════════════════════════════════════════════════
# build-deploy.yml — Reusable CI/CD Workflow
# ═══════════════════════════════════════════════════════════════
# Aufruf aus jedem App-Repo:
#   jobs:
#     deploy:
#       uses: mark-baumann/infrastruktur-deployment/.github/workflows/build-deploy.yml@master
#       with:
#         service_name: spam-klassifikation
#         port: "8510"
#         healthcheck_type: http
#       secrets: inherit
#
# Headless-Service (kein Port, heartbeat_file statt HTTP):
#   jobs:
#     deploy:
#       uses: mark-baumann/infrastruktur-deployment/.github/workflows/build-deploy.yml@master
#       with:
#         service_name: daten-feed-worker
#         healthcheck_type: heartbeat_file
#       secrets: inherit

name: Build & Deploy

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
        description: "Name des Docker-Services (wie in docker-compose.yml)"
      port:
        required: false
        type: string
        default: ""
        description: "Port des Services (leer für Headless-Services)"
      dockerfile_path:
        required: false
        type: string
        default: "Dockerfile"
        description: "Pfad zum Dockerfile"
      app_file:
        required: false
        type: string
        default: "app/app.py"
        description: "Pfad zur App-Hauptdatei"
      healthcheck_type:
        required: false
        type: string
        default: "http"
        description: "http | heartbeat_file | none"
      source_repository:
        required: false
        type: string
        default: ""
        description: "Quell-Repo für direkten workflow_dispatch"
      image_name:
        required: false
        type: string
        default: ""
        description: "GHCR-Image-Name für direkten workflow_dispatch"

  # On-demand Deploy aus Paperclip/Claude Code Agent
  # POST /repos/mark-baumann/<repo>/actions/workflows/deploy.yml/dispatches
  workflow_dispatch:
    inputs:
      service_name:
        required: true
        type: string
        description: "Name des Docker-Services (wie in docker-compose.yml)"
      port:
        required: false
        type: string
        default: ""
        description: "Port des Services (leer für Headless-Services)"
      dockerfile_path:
        required: false
        type: string
        default: "Dockerfile"
        description: "Pfad zum Dockerfile"
      app_file:
        required: false
        type: string
        default: "app/app.py"
        description: "Pfad zur App-Hauptdatei"
      healthcheck_type:
        required: false
        type: string
        default: "http"
        description: "http | heartbeat_file | none"
      source_repository:
        required: false
        type: string
        default: ""
        description: "Quell-Repo, z.B. mark-baumann/status-dashboard"
      image_name:
        required: false
        type: string
        default: ""
        description: "GHCR-Image-Name, z.B. status-dashboard"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository || github.repository }}

      - name: 🔑 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile_path }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PORT=${{ inputs.port }}
            SERVICE_NAME=${{ inputs.service_name }}
          tags: |
            ghcr.io/mark-baumann/${{ inputs.image_name || github.event.repository.name }}:latest
            ghcr.io/mark-baumann/${{ inputs.image_name || github.event.repository.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, pi]
    steps:
      - name: 🔐 Configure .env (Secrets → Pi)
        env:
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
        run: |
          for STACK_DIR in /opt/data/stack /opt/stack /home/mark/stack /home/mark/infrastruktur-deployment /home/mark/projects/infrastruktur-deployment; do
            [ -f "$STACK_DIR/docker-compose.yml" ] && break
          done
          cd "$STACK_DIR"
          touch .env
          if [ -n "$TUNNEL_TOKEN" ]; then
            if grep -q "^TUNNEL_TOKEN=" .env 2>/dev/null; then
              sed -i "s|^TUNNEL_TOKEN=.*|TUNNEL_TOKEN=${TUNNEL_TOKEN}|" .env
            else
              echo "TUNNEL_TOKEN=${TUNNEL_TOKEN}" >> .env
            fi
            echo "✅ TUNNEL_TOKEN in .env gesetzt"
          else
            echo "⚠️ TUNNEL_TOKEN nicht verfügbar (Secret fehlt?)"
          fi

      - name: 🚀 Deploy
        run: |
          for STACK_DIR in /opt/data/stack /opt/stack /home/mark/stack /home/mark/infrastruktur-deployment /home/mark/projects/infrastruktur-deployment; do
            [ -f "$STACK_DIR/docker-compose.yml" ] && break
          done
          [ -f "$STACK_DIR/docker-compose.yml" ] || { echo "Stack-Verzeichnis nicht gefunden"; exit 1; }
          cd "$STACK_DIR"
          git pull --ff-only origin master
          docker compose pull "${{ inputs.service_name }}"
          docker compose up -d --no-deps "${{ inputs.service_name }}"
          docker compose up -d --no-deps cloudflared || true
          docker image prune -f

      - name: 🩺 Health Check (HTTP)
        if: inputs.healthcheck_type == 'http' || inputs.healthcheck_type == ''
        run: |
          for STACK_DIR in /opt/data/stack /opt/stack /home/mark/stack /home/mark/infrastruktur-deployment /home/mark/projects/infrastruktur-deployment; do
            [ -f "$STACK_DIR/docker-compose.yml" ] && break
          done
          cd "$STACK_DIR"
          sleep 10
          for i in {1..15}; do
            STATUS=$(docker compose exec -T "${{ inputs.service_name }}" \
              python -c "import urllib.request; urllib.request.urlopen('http://localhost:${{ inputs.port }}/_stcore/health')" \
              2>/dev/null && echo "200" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ ${{ inputs.service_name }} healthy (Port ${{ inputs.port }})"
              exit 0
            fi
            echo "⏳ Versuch $i/15 — $STATUS"
            sleep 5
          done
          echo "❌ Health Check fehlgeschlagen"
          docker compose logs --tail=30 "${{ inputs.service_name }}" || true
          exit 1

      - name: 🩺 Health Check (Heartbeat File)
        if: inputs.healthcheck_type == 'heartbeat_file'
        run: |
          FILE="/tmp/${{ inputs.service_name }}-heartbeat.txt"
          MAX_AGE=300
          sleep 10
          for i in {1..12}; do
            if [ -f "$FILE" ]; then
              MTIME=$(stat -c %Y "$FILE")
              NOW=$(date +%s)
              AGE=$((NOW - MTIME))
              if [ "$AGE" -le "$MAX_AGE" ]; then
                echo "✅ ${{ inputs.service_name }} heartbeat ok (${AGE}s ago)"
                exit 0
              else
                echo "⏳ Versuch $i/12 — Heartbeat zu alt: ${AGE}s (max ${MAX_AGE}s)"
              fi
            else
              echo "⏳ Versuch $i/12 — Warte auf $FILE"
            fi
            sleep 5
          done
          echo "❌ Heartbeat Health Check fehlgeschlagen: $FILE"
          exit 1

      - name: ⏭️ Health Check übersprungen
        if: inputs.healthcheck_type == 'none'
        run: |
          echo "⏭️ Health Check übersprungen (healthcheck_type: none)"
