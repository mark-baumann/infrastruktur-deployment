# ═══════════════════════════════════════════════════════════════
# build-deploy.yml — Reusable CI/CD Workflow
# ═══════════════════════════════════════════════════════════════
# Aufruf aus jedem App-Repo:
#   jobs:
#     deploy:
#       uses: mark-baumann/deployment-pipeline/.github/workflows/build-deploy.yml@main
#       with:
#         service_name: spam-klassifikation
#         port: 8510
#       secrets: inherit

name: Build & Deploy

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
        description: "Name des Docker-Services (wie in docker-compose.yml)"
      port:
        required: true
        type: string
        description: "Streamlit-Port (8501-8519)"
      dockerfile_path:
        required: false
        type: string
        default: "Dockerfile"
        description: "Pfad zum Dockerfile"
      app_file:
        required: false
        type: string
        default: "app/app.py"
        description: "Pfad zur Streamlit-App"

  # On-demand Deploy aus Paperclip/Claude Code Agent
  # POST /repos/mark-baumann/<repo>/actions/workflows/deploy.yml/dispatches
  workflow_dispatch:
    inputs:
      service_name:
        required: true
        type: string
        description: "Name des Docker-Services (wie in docker-compose.yml)"
      port:
        required: true
        type: string
        description: "Streamlit-Port (8501-8519)"
      dockerfile_path:
        required: false
        type: string
        default: "Dockerfile"
        description: "Pfad zum Dockerfile"
      app_file:
        required: false
        type: string
        default: "app/app.py"
        description: "Pfad zur Streamlit-App"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔑 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile_path }}
          push: true
          build-args: |
            PORT=${{ inputs.port }}
          tags: |
            ghcr.io/mark-baumann/${{ github.event.repository.name }}:latest
            ghcr.io/mark-baumann/${{ github.event.repository.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, markb]
    steps:
      - name: 🚀 Deploy
        run: |
          cd /opt/data/stack
          docker compose pull "${{ inputs.service_name }}"
          docker compose up -d --no-deps "${{ inputs.service_name }}"
          docker image prune -f

      - name: 🩺 Health Check
        run: |
          sleep 5
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:${{ inputs.port }}/_stcore/health --max-time 3 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ ${{ inputs.service_name }} healthy (Port ${{ inputs.port }})"
              exit 0
            fi
            echo "⏳ Versuch $i/10 — HTTP $STATUS"
            sleep 3
          done
          echo "❌ Health Check fehlgeschlagen"
          exit 1
