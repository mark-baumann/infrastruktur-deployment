name: WP Admin Recover (temporary AUG-364)

on:
  workflow_dispatch:
    inputs:
      new_password:
        description: "New password for WP admin user (legacy fallback)"
        required: false
        type: string

jobs:
  recover:
    runs-on: [self-hosted, pi]
    steps:
      - name: Locate stack dir
        run: |
          for STACK_DIR in /opt/data/stack /opt/stack /home/mark/stack /home/mark/infrastruktur-deployment /home/mark/projects/infrastruktur-deployment; do
            [ -f "$STACK_DIR/docker-compose.yml" ] && break
          done
          [ -f "$STACK_DIR/docker-compose.yml" ] || { echo "STACK_DIR not found"; exit 1; }
          echo "STACK_DIR=$STACK_DIR" >> "$GITHUB_ENV"

      - name: Show WordPress container state
        run: |
          cd "$STACK_DIR"
          docker compose ps wordpress wordpress-db || true

      - name: Resolve target password (secret preferred, falls back to dispatch input)
        run: |
          if [ -n "${{ secrets.WP_ADMIN_NEW_PASSWORD }}" ]; then
            echo "using repository secret"
            echo "TARGET_PW=${{ secrets.WP_ADMIN_NEW_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "using dispatch input"
            echo "TARGET_PW=${{ github.event.inputs.new_password }}" >> "$GITHUB_ENV"
          fi

      - name: List WP users before
        run: |
          cd "$STACK_DIR"
          DBPW=$(grep -E '^(WORDPRESS_DB_PASSWORD|MYSQL_PASSWORD)=' .env | head -1 | cut -d= -f2-)
          docker compose exec -T \
            -e "DBPW=$DBPW" \
            wordpress-db \
            sh -c 'MYSQL_PWD="$DBPW" mariadb -uwordpress wordpress -e "SELECT ID,user_login,user_email FROM wp_users;"'

      - name: Generate bcrypt hash via wordpress container PHP
        run: |
          cd "$STACK_DIR"
          set -e
          HASH=$(docker compose exec -T wordpress php -r 'echo password_hash($argv[1], PASSWORD_BCRYPT);' "$TARGET_PW")
          echo "hash generated len=${#HASH}"
          echo "WP_HASH=$HASH" >> "$GITHUB_ENV"

      - name: Reset admin password (hash via env)
        run: |
          cd "$STACK_DIR"
          DBPW=$(grep -E '^(WORDPRESS_DB_PASSWORD|MYSQL_PASSWORD)=' .env | head -1 | cut -d= -f2-)
          docker compose exec -T \
            -e "WP_HASH=$WP_HASH" \
            -e "DBPW=$DBPW" \
            wordpress-db \
            sh -c 'MYSQL_PWD="$DBPW" mariadb -uwordpress wordpress -e "UPDATE wp_users SET user_pass=\"$WP_HASH\" WHERE user_login=\"mark\";"'
          echo "password updated"

      - name: Verify stored hash prefix and users
        run: |
          cd "$STACK_DIR"
          DBPW=$(grep -E '^(WORDPRESS_DB_PASSWORD|MYSQL_PASSWORD)=' .env | head -1 | cut -d= -f2-)
          docker compose exec -T \
            -e "DBPW=$DBPW" \
            wordpress-db \
            sh -c 'MYSQL_PWD="$DBPW" mariadb -uwordpress wordpress -e "SELECT ID,user_login,LEFT(user_pass,4) AS pw_prefix FROM wp_users;"'

      - name: Verify login via wp-login.php
        run: |
          DOMAIN=$(grep -E '^WP_HOME=|^WORDPRESS_HOME=' .env .env.template 2>/dev/null | head -1 | cut -d= -f2-)
          if [ -z "$DOMAIN" ]; then DOMAIN="https://markb.de"; fi
          echo "verifying login against ${DOMAIN}/wp-login.php"
          # disable history to avoid leaking the password into shell history
          set +e
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -c /tmp/wpck.txt \
            -d "log=mark" \
            --data-urlencode "pwd=$TARGET_PW" \
            --data-urlencode "wp-submit=Log In" \
            --data-urlencode "redirect_to=${DOMAIN}/wp-admin/" \
            -e "${DOMAIN}/wp-login.php" \
            "${DOMAIN}/wp-login.php")
          echo "login http code: $CODE"
          grep -q "wordpress_logged_in" /tmp/wpck.txt && echo "AUTH COOKIE: present" || echo "AUTH COOKIE: missing"
          rm -f /tmp/wpck.txt
          [ "$CODE" = "302" ] || { echo "login verification failed"; exit 1; }
