name: WP Admin Recover (temporary)

on:
  workflow_dispatch:
    inputs:
      new_password:
        description: "New password for WP admin user"
        required: true
        type: string

jobs:
  recover:
    runs-on: [self-hosted, pi]
    steps:
      - name: Locate stack dir
        run: |
          for STACK_DIR in /opt/data/stack /opt/stack /home/mark/stack /home/mark/infrastruktur-deployment /home/mark/projects/infrastruktur-deployment; do
            [ -f "$STACK_DIR/docker-compose.yml" ] && break
          done
          [ -f "$STACK_DIR/docker-compose.yml" ] || { echo "❌ Stack-Dir nicht gefunden"; exit 1; }
          echo "STACK_DIR=$STACK_DIR" >> "$GITHUB_ENV"

      - name: Show WordPress container state
        run: |
          cd "$STACK_DIR"
          docker compose ps wordpress wordpress-db || true

      - name: Generate bcrypt hash via wordpress container PHP
        run: |
          cd "$STACK_DIR"
          set -e
          # shellcheck disable=SC2016
          HASH=$(docker compose exec -T wordpress php -r 'echo password_hash($argv[1], PASSWORD_BCRYPT);' "${{ github.event.inputs.new_password }}")
          echo "hash generated len=${#HASH}"
          echo "WP_HASH=$HASH" >> "$GITHUB_ENV"

      - name: List WP users
        run: |
          cd "$STACK_DIR"
          set +e
          docker compose exec -T wordpress-db sh -c 'MYSQL_PWD="${MYSQL_ROOT_PASSWORD:-}" ; true' 2>/dev/null
          # pull db password from .env (WORDPRESS_DB_PASSWORD or MYSQL_PASSWORD)
          DBPW=$(grep -E '^(WORDPRESS_DB_PASSWORD|MYSQL_PASSWORD)=' .env | head -1 | cut -d= -f2-)
          echo "db password present: $([ -n "$DBPW" ] && echo yes || echo no)"
          docker compose exec -T wordpress-db \
            sh -c "MYSQL_PWD='$DBPW' mariadb -uwordpress wordpress -e 'SELECT ID,user_login,user_email FROM wp_users;'"

      - name: Reset admin password
        run: |
          cd "$STACK_DIR"
          DBPW=$(grep -E '^(WORDPRESS_DB_PASSWORD|MYSQL_PASSWORD)=' .env | head -1 | cut -d= -f2-)
          docker compose exec -T wordpress-db \
            sh -c "MYSQL_PWD='$DBPW' mariadb -uwordpress wordpress -e \"UPDATE wp_users SET user_pass='$WP_HASH' WHERE user_login='mark';\""
          echo "password updated"
          docker compose exec -T wordpress-db \
            sh -c "MYSQL_PWD='$DBPW' mariadb -uwordpress wordpress -e 'SELECT ID,user_login,user_email FROM wp_users;'"