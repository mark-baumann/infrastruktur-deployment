name: Deploy Service

on:
  workflow_dispatch:
    inputs:
      service_name:
        required: true
        type: string
        description: "Name des Docker-Services in docker-compose.yml"
      port:
        required: false
        type: string
        default: ""
        description: "Port für den HTTP-Healthcheck"

jobs:
  deploy:
    runs-on: [self-hosted, pi]
    steps:
      - name: Deploy
        run: |
          for STACK_DIR in /opt/data/stack /opt/stack /home/mark/stack /home/mark/infrastruktur-deployment /home/mark/projects/infrastruktur-deployment; do
            [ -f "$STACK_DIR/docker-compose.yml" ] && break
          done
          if [ ! -f "$STACK_DIR/docker-compose.yml" ]; then
            echo "Stack-Verzeichnis nicht gefunden; vorhandene Compose-Dateien:"
            find /home/mark /opt -maxdepth 5 -name docker-compose.yml -print 2>/dev/null || true
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Ports}}' || true
            exit 1
          fi
          cd "$STACK_DIR"
          git pull --ff-only origin master
          docker compose pull "${{ inputs.service_name }}"
          docker compose up -d --no-deps "${{ inputs.service_name }}"
          docker image prune -f

      - name: Health Check
        if: inputs.port != ''
        run: |
          for STACK_DIR in /opt/data/stack /opt/stack /home/mark/stack /home/mark/infrastruktur-deployment /home/mark/projects/infrastruktur-deployment; do
            [ -f "$STACK_DIR/docker-compose.yml" ] && break
          done
          cd "$STACK_DIR"
          sleep 10
          for i in {1..15}; do
            STATUS=$(docker compose exec -T "${{ inputs.service_name }}" \
              python -c "import urllib.request; urllib.request.urlopen('http://localhost:${{ inputs.port }}/_stcore/health')" \
              2>/dev/null && echo "200" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ ${{ inputs.service_name }} healthy (Port ${{ inputs.port }})"
              exit 0
            fi
            echo "Versuch $i/15 — $STATUS"
            sleep 5
          done
          echo "❌ Health Check fehlgeschlagen"
          docker compose logs --tail=30 "${{ inputs.service_name }}" || true
          exit 1
