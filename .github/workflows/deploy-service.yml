name: Deploy Service

on:
  workflow_dispatch:
    inputs:
      service_name:
        required: true
        type: string
        description: "Name des Docker-Services in docker-compose.yml"
      port:
        required: false
        type: string
        default: ""
        description: "Port für den HTTP-Healthcheck"

jobs:
  deploy:
    runs-on: [self-hosted, pi]
    steps:
      - name: Configure .env (Secrets → Pi)
        env:
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
        run: |
          for STACK_DIR in /opt/data/stack /opt/stack /home/mark/stack /home/mark/infrastruktur-deployment /home/mark/projects/infrastruktur-deployment; do
            [ -f "$STACK_DIR/docker-compose.yml" ] && break
          done
          cd "$STACK_DIR"
          touch .env
          if [ -n "$TUNNEL_TOKEN" ]; then
            if grep -q "^TUNNEL_TOKEN=" .env 2>/dev/null; then
              sed -i "s|^TUNNEL_TOKEN=.*|TUNNEL_TOKEN=${TUNNEL_TOKEN}|" .env
            else
              echo "TUNNEL_TOKEN=${TUNNEL_TOKEN}" >> .env
            fi
            echo "✅ TUNNEL_TOKEN in .env gesetzt"
          else
            echo "⚠️ TUNNEL_TOKEN nicht verfügbar (Secret fehlt?)"
          fi

      - name: Deploy
        run: |
          for STACK_DIR in /opt/data/stack /opt/stack /home/mark/stack /home/mark/infrastruktur-deployment /home/mark/projects/infrastruktur-deployment; do
            [ -f "$STACK_DIR/docker-compose.yml" ] && break
          done
          if [ ! -f "$STACK_DIR/docker-compose.yml" ]; then
            echo "Stack-Verzeichnis nicht gefunden; vorhandene Compose-Dateien:"
            find /home/mark /opt -maxdepth 5 -name docker-compose.yml -print 2>/dev/null || true
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Ports}}' || true
            exit 1
          fi
          cd "$STACK_DIR"
          [ -d .git ] && git pull --ff-only origin master || echo "⚠️ Not a git repository, skipping git pull"
          docker compose pull "${{ inputs.service_name }}"
          docker compose up -d --no-deps "${{ inputs.service_name }}"
          # Cloudflared neu starten damit TUNNEL_TOKEN wirksam wird
          docker compose up -d --no-deps cloudflared || true
          docker image prune -f
          echo "=== Container Status ==="
          docker compose ps "${{ inputs.service_name }}" || true
          echo "=== Container Logs (letzte 20 Zeilen) ==="
          sleep 5
          docker compose logs --tail=20 "${{ inputs.service_name }}" || true

      - name: Health Check
        if: inputs.port != ''
        run: |
          for STACK_DIR in /opt/data/stack /opt/stack /home/mark/stack /home/mark/infrastruktur-deployment /home/mark/projects/infrastruktur-deployment; do
            [ -f "$STACK_DIR/docker-compose.yml" ] && break
          done
          cd "$STACK_DIR"
          sleep 10
          for i in {1..15}; do
            STATUS=$(docker compose exec -T "${{ inputs.service_name }}" \
              python -c "import urllib.request; urllib.request.urlopen('http://localhost:${{ inputs.port }}/_stcore/health')" \
              2>/dev/null && echo "200" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ ${{ inputs.service_name }} healthy (Port ${{ inputs.port }})"
              exit 0
            fi
            echo "Versuch $i/15 — $STATUS"
            sleep 5
          done
          echo "❌ Health Check fehlgeschlagen"
          docker compose logs --tail=30 "${{ inputs.service_name }}" || true
          exit 1
