name: Register Pi Runner for Repo

on:
  workflow_dispatch:
    inputs:
      target_repo:
        required: true
        type: string
        description: "Repo für den neuen Runner (z.B. agenten-verstaerkungslernen)"
      registration_token:
        required: true
        type: string
        description: "Runner Registration Token (von github.com/{owner}/{repo}/settings/actions/runners/new)"
      runner_name:
        required: false
        type: string
        description: "Runner Name (default: pi-runner-{target_repo})"

jobs:
  register:
    runs-on: [self-hosted, pi]
    steps:
      - name: Register new runner
        run: |
          REPO="${{ inputs.target_repo }}"
          TOKEN="${{ inputs.registration_token }}"
          NAME="${{ inputs.runner_name || format('pi-runner-{0}', inputs.target_repo) }}"
          RUNNER_BASE="/home/mark/runners"
          RUNNER_DIR="${RUNNER_BASE}/${REPO}"

          echo "Registriere Runner '${NAME}' für mark-baumann/${REPO}..."

          mkdir -p "${RUNNER_DIR}"
          cd "${RUNNER_DIR}"

          # Runner binary kopieren wenn noch nicht vorhanden
          if [ ! -f "./run.sh" ]; then
            # Suche existierendes Runner-Verzeichnis als Vorlage (nicht das eigene, leere Zielverzeichnis)
            EXISTING_RUNNER=$(find /home/mark -name "run.sh" -maxdepth 4 2>/dev/null | grep -vF "${RUNNER_DIR}/run.sh" | head -1)
            if [ -z "$EXISTING_RUNNER" ]; then
              echo "❌ Kein existierender Runner gefunden zum Kopieren"
              exit 1
            fi
            EXISTING_DIR=$(dirname "$EXISTING_RUNNER")
            echo "Kopiere Runner von: $EXISTING_DIR"
            cp -r "${EXISTING_DIR}/." "${RUNNER_DIR}/"
            # AUG-422: Identität/State der Quelle NIE mit rüberkopieren.
            sudo rm -f "${RUNNER_DIR}/.runner" "${RUNNER_DIR}/.credentials" "${RUNNER_DIR}/.credentials_rsaparams" "${RUNNER_DIR}/.service" "${RUNNER_DIR}/.path" "${RUNNER_DIR}/.env" "${RUNNER_DIR}/.runner_migrated"
            sudo rm -rf "${RUNNER_DIR}/_diag"
          fi

          # AUG-422: "svc.sh" ist KEIN generisches Skript — config.sh schreibt
          # den Servicenamen als Literal in die Zeile "SVC_NAME=..." von svc.sh
          # hinein. Ein per "cp -r" kopiertes svc.sh trägt deshalb (auch ohne
          # ".service"/".runner" im Verzeichnis!) noch den SVC_NAME des Quell-
          # Repos. "svc.sh stop/uninstall" damit auszuführen beendet/entfernt
          # den LAUFENDEN systemd-Dienst des Quell-Repos statt eines eigenen —
          # genau das hat den Pi-Runner von schach-reinforcement-lernen beim
          # Onboarding von bewerbung-agent zweimal offline genommen. Deshalb:
          # svc.sh nur anfassen, wenn sein SVC_NAME schon zu DIESEM Repo passt.
          CURRENT_SVC_NAME=""
          if [ -f "${RUNNER_DIR}/svc.sh" ]; then
            CURRENT_SVC_NAME=$(grep -m1 '^SVC_NAME=' "${RUNNER_DIR}/svc.sh" | sed -E 's/^SVC_NAME="?([^"]*)"?$/\1/')
          fi
          if [ -n "$CURRENT_SVC_NAME" ] && ! echo "$CURRENT_SVC_NAME" | grep -q "mark-baumann-${REPO}\."; then
            echo "⚠️  svc.sh gehört zu einem fremden Service ($CURRENT_SVC_NAME) — kein Stop/Uninstall, nur Identität verwerfen"
            sudo rm -f "${RUNNER_DIR}/svc.sh" "${RUNNER_DIR}/.runner" "${RUNNER_DIR}/.credentials" "${RUNNER_DIR}/.credentials_rsaparams" "${RUNNER_DIR}/.service" "${RUNNER_DIR}/.runner_migrated"
            CURRENT_SVC_NAME=""
          fi

          # Alten Service stoppen/entfernen und jegliche Zugangsdaten aus einem
          # vorherigen (ggf. fehlgeschlagenen) Registrierungsversuch entfernen.
          # Nur wenn svc.sh oben als "eigen" bestätigt wurde oder gar nicht mehr
          # existiert (dann sind stop/uninstall harmlose No-ops) — nie auf einer
          # fremden svc.sh-Kopie (Diagnose siehe PR #3 und AUG-422).
          if [ -z "$CURRENT_SVC_NAME" ] || echo "$CURRENT_SVC_NAME" | grep -q "mark-baumann-${REPO}\."; then
            sudo ./svc.sh stop 2>/dev/null || true
            sudo ./svc.sh uninstall 2>/dev/null || true
          fi
          # "remove" kennt kein --unattended (nur "config.sh" selbst hat das) —
          # mit dem Flag schlug der Befehl bisher immer fehl und entfernte nichts.
          ./config.sh remove --token "${TOKEN}" 2>&1 || true
          sudo rm -f "${RUNNER_DIR}/.runner" "${RUNNER_DIR}/.credentials" "${RUNNER_DIR}/.credentials_rsaparams" "${RUNNER_DIR}/.service" "${RUNNER_DIR}/.runner_migrated"

          # Runner konfigurieren
          ./config.sh \
            --url "https://github.com/mark-baumann/${REPO}" \
            --token "${TOKEN}" \
            --name "${NAME}" \
            --labels "self-hosted,Linux,ARM64,pi" \
            --unattended \
            --replace \
            2>&1

          # Als systemd Service einrichten
          sudo ./svc.sh install "${USER}" 2>&1 || true
          sudo ./svc.sh start 2>&1 || true

          echo "✅ Runner '${NAME}' für mark-baumann/${REPO} registriert und gestartet"
          echo "Status:"
          sudo ./svc.sh status 2>&1 || true
