name: WP Security Cleanup Followup (temporary)

on:
  workflow_dispatch: {}

jobs:
  followup:
    runs-on: [self-hosted, pi]
    steps:
      - name: Locate stack dir
        run: |
          for STACK_DIR in /home/mark/infrastruktur-deployment /opt/data/stack /opt/stack /home/mark/stack /home/mark/projects/infrastruktur-deployment; do
            [ -f "$STACK_DIR/docker-compose.yml" ] && break
          done
          [ -f "$STACK_DIR/docker-compose.yml" ] || { echo "Stack-Dir nicht gefunden"; exit 1; }
          echo "STACK_DIR=$STACK_DIR" >> "$GITHUB_ENV"

      - name: Resolve DB credentials
        run: |
          cd "$STACK_DIR"
          DBPW=$(grep -E '^(WORDPRESS_DB_PASSWORD|MYSQL_PASSWORD)=' .env | head -1 | cut -d= -f2-)
          if [ -z "$DBPW" ]; then echo "DB-Passwort nicht in .env gefunden"; exit 1; fi
          echo "::add-mask::$DBPW"
          echo "DBPW=$DBPW" >> "$GITHUB_ENV"

      - name: Inspect wp-config.php eval() finding
        run: |
          cd "$STACK_DIR"
          echo "### wp-config.php Analyse (eval-Fund)" >> "$GITHUB_STEP_SUMMARY"
          echo "-- Kontext um die eval()-Zeile:" | tee -a "$GITHUB_STEP_SUMMARY"
          docker compose exec -T wordpress sh -c "grep -n . wp-config.php | sed -n '110,140p'" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "-- alle Vorkommen von configExtra:" | tee -a "$GITHUB_STEP_SUMMARY"
          docker compose exec -T wordpress sh -c "grep -n 'configExtra' wp-config.php" | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo "-- verdaechtige includes/requires in wp-config.php:" | tee -a "$GITHUB_STEP_SUMMARY"
          docker compose exec -T wordpress sh -c "grep -nE 'require|include' wp-config.php" | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Check demfilz-studio-core plugin for obfuscation
        run: |
          cd "$STACK_DIR"
          echo "### demfilz-studio-core Plugin-Check" >> "$GITHUB_STEP_SUMMARY"
          docker compose exec -T wordpress sh -c 'find wp-content/plugins/demfilz-studio-core -type f -iname "*.php" | xargs -I{} sh -c "wc -l {}"' | tee -a "$GITHUB_STEP_SUMMARY" || true
          docker compose exec -T wordpress sh -c 'grep -rlE "eval\s*\(|base64_decode\s*\(|gzinflate\s*\(|str_rot13\s*\(|create_function\s*\(" wp-content/plugins/demfilz-studio-core wp-content/themes/creative-designer-portfolio 2>/dev/null' | tee -a "$GITHUB_STEP_SUMMARY" || echo "keine verdaechtigen Muster gefunden" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Retry core/plugin/theme update with correct env
        continue-on-error: true
        run: |
          cd "$STACK_DIR"
          WP=$(docker compose ps -q wordpress 2>/dev/null | head -1)
          NET=$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}' "$WP" 2>/dev/null | head -1)
          RUN="docker run --rm --env-file .env --volumes-from $WP --network $NET wordpress:cli wp --allow-root --path=/var/www/html"
          echo "### Update-Lauf (mit --env-file)" >> "$GITHUB_STEP_SUMMARY"
          $RUN core update 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          $RUN plugin update --all 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          $RUN theme update --all 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo "-- Versionen nach Update:" | tee -a "$GITHUB_STEP_SUMMARY"
          $RUN core version 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          $RUN plugin list 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
