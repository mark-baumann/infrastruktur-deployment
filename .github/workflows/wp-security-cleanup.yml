name: WP Security Cleanup Followup 2 (temporary)

on:
  workflow_dispatch: {}

jobs:
  followup2:
    runs-on: [self-hosted, pi]
    steps:
      - name: Locate stack dir
        run: |
          for STACK_DIR in /home/mark/infrastruktur-deployment /opt/data/stack /opt/stack /home/mark/stack /home/mark/projects/infrastruktur-deployment; do
            [ -f "$STACK_DIR/docker-compose.yml" ] && break
          done
          [ -f "$STACK_DIR/docker-compose.yml" ] || { echo "Stack-Dir nicht gefunden"; exit 1; }
          echo "STACK_DIR=$STACK_DIR" >> "$GITHUB_ENV"

      - name: Check WORDPRESS_CONFIG_EXTRA for injected code
        run: |
          cd "$STACK_DIR"
          echo "### WORDPRESS_CONFIG_EXTRA Check" >> "$GITHUB_STEP_SUMMARY"
          if grep -q '^WORDPRESS_CONFIG_EXTRA=' .env; then
            LEN=$(grep '^WORDPRESS_CONFIG_EXTRA=' .env | cut -d= -f2- | wc -c)
            echo "WORDPRESS_CONFIG_EXTRA ist gesetzt, Laenge=$LEN Zeichen" | tee -a "$GITHUB_STEP_SUMMARY"
            grep '^WORDPRESS_CONFIG_EXTRA=' .env | cut -d= -f2- | grep -oE 'eval|base64_decode|system|exec|shell_exec|passthru|assert' | sort -u | tee -a "$GITHUB_STEP_SUMMARY" || echo "keine gefaehrlichen Funktionsnamen im Wert gefunden" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "WORDPRESS_CONFIG_EXTRA ist NICHT gesetzt -> eval() in wp-config.php ist inaktiv (unbedenklich)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fix wp-content/upgrade ownership for wp-cli updates
        run: |
          cd "$STACK_DIR"
          docker compose exec -T -u root wordpress sh -c 'mkdir -p wp-content/upgrade && chown -R www-data:www-data wp-content'
          docker compose exec -T wordpress sh -c 'ls -ld wp-content wp-content/upgrade'

      - name: Resolve DB credentials
        run: |
          cd "$STACK_DIR"
          DBPW=$(grep -E '^(WORDPRESS_DB_PASSWORD|MYSQL_PASSWORD)=' .env | head -1 | cut -d= -f2-)
          if [ -z "$DBPW" ]; then echo "DB-Passwort nicht in .env gefunden"; exit 1; fi
          echo "::add-mask::$DBPW"
          echo "DBPW=$DBPW" >> "$GITHUB_ENV"

      - name: Retry core/plugin/theme update
        continue-on-error: true
        run: |
          cd "$STACK_DIR"
          WP=$(docker compose ps -q wordpress 2>/dev/null | head -1)
          NET=$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}' "$WP" 2>/dev/null | head -1)
          RUN="docker run --rm --env-file .env --user 33:33 --volumes-from $WP --network $NET wordpress:cli wp --allow-root --path=/var/www/html"
          echo "### Update-Lauf (Versuch 2, uid 33 = www-data)" >> "$GITHUB_STEP_SUMMARY"
          $RUN core update 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          $RUN plugin update --all 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          $RUN theme update --all 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo "-- Versionen nach Update:" | tee -a "$GITHUB_STEP_SUMMARY"
          $RUN core version 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          $RUN plugin list 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          $RUN theme list 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify site still responds
        run: |
          cd "$STACK_DIR"
          STATUS="000"
          for i in $(seq 1 10); do
            STATUS=$(docker compose exec -T wordpress curl -s -o /dev/null -w "%{http_code}" http://localhost:80/ 2>/dev/null || echo "000")
            echo "attempt $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && break
            sleep 5
          done
          echo "final status: $STATUS" | tee -a "$GITHUB_STEP_SUMMARY"
