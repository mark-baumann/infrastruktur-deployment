    restart: unless-stopped
    env_file: .env
    networks: [internal]
    healthcheck:
      test: ["CMD", "bash", "-c", "FILE=/tmp/daten-feed-worker-heartbeat.txt && [ -f $$FILE ] && [ $(( $(date +%s) - $(stat -c %Y $$FILE) )) -le 300 ]"]
      interval: 60s
      timeout: 5s
      retries: 3

  ocr-agent:
