# AUTO-GENERATED — nicht manuell bearbeiten
# Quelle: config/services.yaml  |  Generator: scripts/render_configs.py

services:

  handels-agenten:
    image: ghcr.io/mark-baumann/handels-agenten:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=8503
      - TRADINGAGENTS_LLM_PROVIDER=ollama_cloud
    volumes:
      - handels_agenten_data:/home/appuser/.tradingagents
    networks: [edge]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8503/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  dokumenten-agent:
    image: ghcr.io/mark-baumann/rag-agent-langgraph:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=8512
    volumes:
      - /opt/data/dokumenten-agent/chroma:/app/data/chroma
    networks: [edge]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8512/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  hermes-agent:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      - PORT=9119
      - OPENAI_API_KEY=${OLLAMA_API_KEY}
      - OPENAI_BASE_URL=${OLLAMA_BASE_URL}
      - OPENAI_MODEL=${OLLAMA_MODEL}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - LLM_MODEL=${OLLAMA_MODEL}
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - API_SERVER_KEY=${HERMES_API_SERVER_KEY}
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_UID=1000
      - HERMES_GID=1000
    volumes:
      - /home/mark/.hermes:/opt/data
    networks: [edge]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9119/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  paperclip:
    build:
      context: ./paperclip-patch
      args:
        PAPERCLIP_IMAGE_TAG: ${PAPERCLIP_IMAGE_TAG:-latest}
    image: paperclip-patched:local
    container_name: paperclip
    user: "1000:1000"
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3100
      - HOST=0.0.0.0
      - SERVE_UI=true
      - PAPERCLIP_HOME=/paperclip
      - PAPERCLIP_DEPLOYMENT_MODE=authenticated
      - PAPERCLIP_DEPLOYMENT_EXPOSURE=private
      - PAPERCLIP_PUBLIC_URL=${PAPERCLIP_PUBLIC_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - PAPERCLIP_TOOL_ACTION_SIGNING_SECRET=${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET}
      - OPENAI_API_KEY=${OLLAMA_API_KEY}
      - OPENAI_BASE_URL=${OLLAMA_BASE_URL}
      - OPENAI_MODEL=${OLLAMA_MODEL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
    volumes:
      - /opt/data/paperclip:/paperclip
    networks: [edge]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3100/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  wordpress:
    image: wordpress:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=80
    volumes:
      - /opt/data/wordpress/html:/var/www/html
    networks: [edge]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  wordpress-db:
    image: mariadb:11
    restart: unless-stopped
    env_file: .env
    volumes:
      - /opt/data/wordpress/db:/var/lib/mysql
    networks: [edge]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    networks: [edge]

networks:
  edge:
    driver: bridge

volumes:
  handels_agenten_data:
