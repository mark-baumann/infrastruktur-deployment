services:

  vergleich-agenten:
    image: ghcr.io/mark-baumann/vergleichs-ki:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    networks: [edge]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

