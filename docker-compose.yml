      retries: 3

  # ── Cloudflare-Tunnel ──
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    networks: [edge]

networks:
  edge:
    driver: bridge
