# ═══════════════════════════════════════════════════════════════
# docker-compose.yml — 14 Streamlit-Dienste + Cloudflare-Tunnel
# ═══════════════════════════════════════════════════════════════
# Deployment: cd /opt/data/stack && docker compose up -d
# Rollback:   IMAGE_TAG=<sha> docker compose up -d <service>

services:
  # ── Core-Dienste (Ports 8501-8505) ──
  vergleich-agenten:
    image: ghcr.io/mark-baumann/vergleichs-ki:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    networks: [edge]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  finanz-agenten:
    image: ghcr.io/mark-baumann/finanz-assistent:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    networks: [edge]
    healthcheck:
